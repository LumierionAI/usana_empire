<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="diagnostic-id" content="15661635">
  <title>Receipt Generator - USANA Empire</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--text-main);
    }
    
    /* Shared ToolShell styles */
    .tool-shell { max-width: 1400px; margin: 0 auto; padding: var(--spacing-md); }
    .tool-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: var(--spacing-sm); margin-bottom: var(--spacing-lg);
    }
    .back-link { text-decoration: none; color: var(--color-secondary); font-weight: bold; }
    
    /* View Toggling */
    .view-section { display: none; }
    .view-section.active { display: block; }
    
    .header-actions { display: flex; gap: var(--spacing-md); }
    .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); }
    .btn-danger { background: #FEE2E2; color: #DC2626; padding: 0.5rem; }

    /* Inherited Invoice Editor Styles */
    .app-container { display: flex; width: 100%; height: 80vh; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
    .editor-pane { width: 45%; background: #fff; padding: 2rem; overflow-y: auto; border-right: 1px solid #ddd; }
    .preview-pane { width: 55%; padding: 2rem; overflow-y: auto; background-color: #E2E8F0; display: flex; justify-content: center; align-items: flex-start; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { font-size: 0.875rem; font-weight: bold; margin-bottom: 0.5rem; }
    .form-group input, .form-group select, .form-group textarea { padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; }
    
    .section-title { font-size: 0.875rem; text-transform: uppercase; color: #666; margin: 1.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #ddd; }
    .line-item-row { display: grid; grid-template-columns: 3fr 1fr 1.5fr auto; gap: 0.5rem; margin-bottom: 0.5rem; }
    
    /* Invoice Paper Styles */
    .invoice-paper { background: white; width: 100%; max-width: 850px; min-height: 1100px; padding: 3rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
    .watermark-paid { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 8rem; font-weight: 700; color: rgba(34, 197, 94, 0.08); border: 12px solid rgba(34, 197, 94, 0.08); padding: 1rem 3rem; border-radius: 1rem; pointer-events: none; z-index: 0; letter-spacing: 0.5rem; }
    .invoice-content-wrapper { position: relative; z-index: 1; }
    
    /* Template: Modern */
    .template-modern { font-family: var(--font-sans); }
    .template-modern .inv-header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--color-primary); padding-bottom: 1.5rem; margin-bottom: 2rem; }
    .template-modern .inv-title { font-size: 2.5rem; font-weight: 700; color: var(--color-primary); }
    .template-modern .billing-section { display: flex; justify-content: space-between; margin-bottom: 2.5rem; }
    .template-modern .table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
    .template-modern .table th { background-color: var(--color-primary); color: white; text-align: left; padding: 1rem; }
    .template-modern .table td { padding: 1rem; border-bottom: 1px solid #ddd; }
    .template-modern .totals-section { display: flex; justify-content: flex-end; }
    .template-modern .totals-box { width: 350px; }
    .template-modern .total-row { display: flex; justify-content: space-between; padding: 0.5rem 0; }
    .template-modern .grand-total { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); border-top: 2px solid var(--color-primary); padding-top: 1rem; margin-top: 0.5rem; }
    
    /* Print overrides */
    @media print {
      body { background: white; overflow: auto; height: auto; }
      .tool-header, .editor-pane, .view-toggles, .header-actions { display: none !important; }
      .preview-pane { width: 100%; padding: 0; background: white; }
      .app-container { border: none; height: auto; display: block; }
      .invoice-paper { box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div id="app-mount"></div>

  <script type="module">
    import { createToolShell } from '../../src/shared/components/ToolShell.js';
    import { createDataTable } from '../../src/shared/components/DataTable.js';
    import { storageAdapter } from '../../src/shared/storage-adapter.js';
    import { calculateNextReminderDate } from '../../src/shared/calc-engine/receipts-calc.js';

    // --- State ---
    let purchases = [];
    let customers = [];
    let currentLineItems = [{ desc: '', qty: 1, price: 0 }];

    // --- UI Scaffolding ---
    function renderApp() {
      const container = document.createElement('div');
      
      container.innerHTML = `
        <div class="header-actions" style="margin-bottom: 1rem;">
          <button id="btn-show-list" class="btn btn-outline">History Dashboard</button>
          <button id="btn-show-editor" class="btn btn-primary">+ New Receipt</button>
        </div>
        
        <!-- View 1: History List -->
        <div id="view-list" class="view-section active">
          <div id="table-mount"></div>
        </div>
        
        <!-- View 2: Invoice Editor -->
        <div id="view-editor" class="view-section">
          <div class="app-container">
            <div class="editor-pane no-print">
              <div class="action-bar" style="display:flex; gap: 1rem; margin-bottom: 1rem;">
                  <button class="btn btn-outline" onclick="window.print()">Print PDF</button>
                  <button class="btn btn-primary" id="btn-save-db">Save to Database</button>
              </div>
              
              <div class="section-title">Invoice Metadata</div>
              <div class="form-grid">
                  <div class="form-group">
                      <label>Invoice Number</label>
                      <input type="text" id="invNumber" value="INV-${Date.now().toString().slice(-4)}">
                  </div>
                  <div class="form-group">
                      <label>Date</label>
                      <input type="date" id="invDate" value="${new Date().toISOString().split('T')[0]}">
                  </div>
                  <div class="form-group">
                      <label>Status</label>
                      <select id="invStatus">
                          <option value="Paid">Paid</option>
                          <option value="Unpaid">Unpaid</option>
                      </select>
                  </div>
                  <div class="form-group">
                      <label>Replenishment Cycle (Days)</label>
                      <input type="number" id="cycleDays" value="30" min="0">
                  </div>
              </div>

              <div class="section-title">Customer Information</div>
              <div class="form-grid">
                  <div class="form-group full-width">
                      <label>Customer Name</label>
                      <input type="text" id="clientName" placeholder="Client Name">
                  </div>
                  <div class="form-group full-width">
                      <label>Customer Details (Address, Email)</label>
                      <textarea id="clientDetails" placeholder="Client Address and Contact Info"></textarea>
                  </div>
              </div>

              <div class="section-title">Line Items</div>
              <div id="lineItemsContainer"></div>
              <button class="btn btn-outline" style="width:100%; margin-top:0.5rem;" id="btn-add-line">+ Add Line Item</button>
            </div>

            <div class="preview-pane">
              <div class="invoice-paper template-modern" id="invoicePaper"></div>
            </div>
          </div>
        </div>
      `;
      return container;
    }

    const appMount = document.getElementById('app-mount');
    appMount.appendChild(createToolShell('Receipt Generator', renderApp()));

    // --- DOM Elements & Listeners ---
    const viewList = document.getElementById('view-list');
    const viewEditor = document.getElementById('view-editor');
    const btnShowList = document.getElementById('btn-show-list');
    const btnShowEditor = document.getElementById('btn-show-editor');
    const tableMount = document.getElementById('table-mount');

    btnShowList.addEventListener('click', () => switchView('list'));
    btnShowEditor.addEventListener('click', () => switchView('editor'));
    document.getElementById('btn-add-line').addEventListener('click', addLineItem);
    document.getElementById('btn-save-db').addEventListener('click', saveInvoiceToDB);

    // Attach preview updates to all inputs
    ['invNumber', 'invDate', 'invStatus', 'clientName', 'clientDetails'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    function switchView(view) {
      if (view === 'list') {
        viewList.classList.add('active'); viewEditor.classList.remove('active');
        loadDashboard();
      } else {
        viewEditor.classList.add('active'); viewList.classList.remove('active');
        updatePreview();
      }
    }

    // --- Editor Logic ---
    function addLineItem() {
      currentLineItems.push({ desc: '', qty: 1, price: 0 });
      renderEditorItems();
      updatePreview();
    }

    window.removeLineItem = (index) => {
      currentLineItems.splice(index, 1);
      renderEditorItems();
      updatePreview();
    };

    window.updateLineItem = (index, field, value) => {
      currentLineItems[index][field] = value;
      updatePreview();
    };

    function renderEditorItems() {
      const container = document.getElementById('lineItemsContainer');
      container.innerHTML = '';
      currentLineItems.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'line-item-row';
        row.innerHTML = `
          <input type="text" placeholder="Description" value="${item.desc}" oninput="updateLineItem(${index}, 'desc', this.value)">
          <input type="number" placeholder="Qty" value="${item.qty}" min="1" oninput="updateLineItem(${index}, 'qty', parseFloat(this.value) || 0)">
          <input type="number" placeholder="Price (Php)" value="${item.price}" min="0" step="1" oninput="updateLineItem(${index}, 'price', parseFloat(this.value) || 0)">
          <button class="btn btn-danger" onclick="removeLineItem(${index})">X</button>
        `;
        container.appendChild(row);
      });
    }

    function formatCurrency(num) {
      return 'Php ' + parseFloat(num).toFixed(2);
    }

    function updatePreview() {
      const invNumber = document.getElementById('invNumber').value;
      const invDate = document.getElementById('invDate').value;
      const status = document.getElementById('invStatus').value;
      const clientName = document.getElementById('clientName').value || '<em>Client Name</em>';
      const clientDetails = document.getElementById('clientDetails').value.replace(/\n/g, '<br>');
      
      let subtotal = 0;
      let itemsHtml = '';
      
      currentLineItems.forEach(item => {
        const total = item.qty * item.price;
        subtotal += total;
        itemsHtml += `
          <tr>
            <td>${item.desc || '<em>Item description</em>'}</td>
            <td style="text-align: center;">${item.qty}</td>
            <td style="text-align: right;">${formatCurrency(item.price)}</td>
            <td style="text-align: right;">${formatCurrency(total)}</td>
          </tr>
        `;
      });

      const paper = document.getElementById('invoicePaper');
      const isPaid = status === 'Paid';
      const statusColor = isPaid ? '#16a34a' : 'var(--text-muted)';
      const watermark = isPaid ? '<div class="watermark-paid">PAID</div>' : '';

      paper.innerHTML = `
        ${watermark}
        <div class="invoice-content-wrapper">
          <div class="inv-header">
            <div>
              <div class="inv-title">INVOICE</div>
              <div style="color: ${statusColor}; margin-top: 0.5rem; font-weight:700;">Status: ${status}</div>
            </div>
            <div style="text-align: right;">
              <strong>USANA Empire</strong><br>
              Independent Distributor
            </div>
          </div>
          <div class="billing-section">
            <div>
              <div style="color: #666; font-size: 0.875rem; margin-bottom: 0.5rem; text-transform:uppercase;">Bill To</div>
              <strong>${clientName}</strong><br>${clientDetails}
            </div>
            <div style="text-align: right;">
              <div style="margin-bottom: 0.5rem;"><strong>Invoice #:</strong> ${invNumber}</div>
              <div style="margin-bottom: 0.5rem;"><strong>Date:</strong> ${invDate}</div>
            </div>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>Description</th>
                <th style="text-align: center; width: 10%;">Qty</th>
                <th style="text-align: right; width: 25%;">Unit Price</th>
                <th style="text-align: right; width: 25%;">Total</th>
              </tr>
            </thead>
            <tbody>${itemsHtml}</tbody>
          </table>
          <div class="totals-section">
            <div class="totals-box">
              <div class="total-row grand-total">
                <span>Total</span>
                <span>${formatCurrency(Math.max(0, subtotal))}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- Database Logic ---
    async function saveInvoiceToDB() {
      const clientName = document.getElementById('clientName').value.trim();
      if (!clientName) return alert('Customer Name is required');
      if (currentLineItems.length === 0 || !currentLineItems[0].desc) return alert('At least one item description is required');

      // 1. Resolve Customer ID
      let customerId = crypto.randomUUID();
      const existingCust = customers.find(c => c.name.toLowerCase() === clientName.toLowerCase());
      if (existingCust) {
        customerId = existingCust.id;
      } else {
        const newCust = {
          id: customerId,
          name: clientName,
          contact: document.getElementById('clientDetails').value,
          createdAt: new Date().toISOString()
        };
        await storageAdapter.set('customers', newCust);
      }

      // 2. Compute Dates & Totals
      const purchaseDate = document.getElementById('invDate').value;
      const cycleDays = parseInt(document.getElementById('cycleDays').value, 10) || 30;
      const reminderDate = calculateNextReminderDate(purchaseDate, cycleDays);
      const total = currentLineItems.reduce((sum, item) => sum + (item.qty * item.price), 0);

      // 3. Create Purchase Record
      const purchaseData = {
        id: document.getElementById('invNumber').value || crypto.randomUUID(),
        customerId: customerId,
        date: purchaseDate,
        lineItems: currentLineItems,
        total: total,
        paymentStatus: document.getElementById('invStatus').value.toLowerCase(),
        nextReminderDate: reminderDate
      };

      await storageAdapter.set('purchases', purchaseData);
      alert('Receipt saved securely to IndexedDB.');
      switchView('list');
    }

    async function loadDashboard() {
      customers = await storageAdapter.list('customers') || [];
      purchases = await storageAdapter.list('purchases') || [];

      const joinedData = purchases.map(p => {
        const cust = customers.find(c => c.id === p.customerId);
        return {
          'Invoice ID': p.id,
          'Date': p.date,
          'Customer': cust ? cust.name : 'Unknown',
          'Total': formatCurrency(p.total),
          'Status': p.paymentStatus.toUpperCase(),
          'Reminder Due': p.nextReminderDate
        };
      });

      const headers = ['Invoice ID', 'Date', 'Customer', 'Total', 'Status', 'Reminder Due'];
      tableMount.innerHTML = '';
      tableMount.appendChild(createDataTable(headers, joinedData));
    }

    // --- Init ---
    renderEditorItems();
    updatePreview();
    loadDashboard();
  </script>
</body>
</html>
