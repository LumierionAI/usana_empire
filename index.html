<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USANA Empire</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
    }
    
    .snap-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }
    
    .snap-section {
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--spacing-xl);
      box-sizing: border-box;
      position: relative;
    }
    
    @media (prefers-reduced-motion: reduce) {
      .snap-container {
        scroll-behavior: auto;
      }
    }

    /* Local rail styles for the presentation deck */
    .progress-rail {
      position: fixed;
      right: var(--spacing-md);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      z-index: 100;
    }
    
    .rail-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-surface);
      border: 2px solid var(--color-primary);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    
    .rail-dot.active {
      background: var(--color-primary);
    }

    .cta-group {
      margin-top: var(--spacing-lg);
      display: flex;
      gap: var(--spacing-md);
    }

    .btn {
      padding: var(--spacing-sm) var(--spacing-md);
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .btn-primary {
      background: var(--color-primary);
      color: var(--color-bg);
    }

    .btn-secondary {
      background: var(--color-secondary);
      color: var(--color-bg);
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>
  <aside id="rail-mount"></aside>
  <main id="main-content" class="snap-container"></main>

  <script type="module">
    import { createNavBar } from './src/shared/components/NavBar.js';
    import { buildProgressRail, updateActiveRail } from './src/landing/progress-rail.js';
    import { initScrollEngine } from './src/landing/scroll-engine.js';

    document.getElementById('nav-mount').appendChild(createNavBar());

    async function initLanding() {
      const response = await fetch('/content/sections.json');
      const sections = await response.json();
      
      const mainContent = document.getElementById('main-content');
      
      sections.forEach(sec => {
        const sectionEl = document.createElement('section');
        sectionEl.className = 'snap-section';
        sectionEl.id = sec.id;
        
        let contentHTML = `<h2>${sec.title}</h2><p>${sec.content}</p>`;
        
        if (sec.id === 'hero') {
          contentHTML += `
            <div class="cta-group">
              <a href="/product/" class="btn btn-primary">Explore Products</a>
              <a href="/business/" class="btn btn-secondary">Explore the Business</a>
            </div>
          `;
        }
        
        sectionEl.innerHTML = contentHTML;
        mainContent.appendChild(sectionEl);
      });

      const railMount = document.getElementById('rail-mount');
      railMount.appendChild(buildProgressRail(sections));

      initScrollEngine('.snap-section', (activeId) => {
        updateActiveRail(activeId);
      });
    }

    initLanding();
  </script>
</body>
</html>
