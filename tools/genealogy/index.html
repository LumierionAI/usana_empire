<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genealogy Simulator - USANA Empire</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
    }
    /* Shared ToolShell styles */
    .tool-shell { max-width: 1200px; margin: 0 auto; padding: var(--spacing-md); }
    .tool-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: var(--spacing-sm); margin-bottom: var(--spacing-lg);
    }
    .back-link { text-decoration: none; color: var(--color-secondary); font-weight: bold; }
    .btn-export, .btn-import { display: none; } /* Hidden for Simulator as there is no persistent DB data */
    
    /* Layout */
    .simulator-layout { display: grid; gap: var(--spacing-lg); grid-template-columns: 1fr; }
    @media (orientation: landscape) and (min-width: 768px) {
      .simulator-layout { grid-template-columns: 300px 1fr; }
    }
    
    .controls { background: var(--color-surface); padding: var(--spacing-md); border-radius: 8px; }
    .control-group { margin-bottom: var(--spacing-md); }
    .control-group label { display: block; font-weight: bold; margin-bottom: var(--spacing-sm); }
    .control-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    
    .results { background: var(--color-surface); padding: var(--spacing-md); border-radius: 8px; border-left: 4px solid var(--color-accent); }
    .disclaimer { font-size: 0.85rem; color: var(--color-error); font-weight: bold; margin-top: var(--spacing-md); }
    
    .tree-view { margin-top: var(--spacing-lg); padding: var(--spacing-md); background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow-x: auto; text-align: center; }
    .node { display: inline-block; padding: var(--spacing-sm) var(--spacing-md); background: var(--color-primary); color: #fff; border-radius: 4px; margin: 4px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app-mount"></div>

  <script type="module">
    import { createToolShell } from '../../src/shared/components/ToolShell.js';
    import { calculateGenealogyOutcome } from '../../src/shared/calc-engine/genealogy-calc.js';

    function renderSimulator() {
      const container = document.createElement('div');
      container.className = 'simulator-layout';

      container.innerHTML = `
        <aside class="controls">
          <h3>Assumptions</h3>
          <div class="control-group">
            <label for="input-levels">Levels Deep</label>
            <input type="number" id="input-levels" min="1" max="6" value="3" />
          </div>
          <div class="control-group">
            <label for="input-recruits">Recruits per Person</label>
            <input type="number" id="input-recruits" min="1" max="10" value="2" />
          </div>
          <div class="control-group">
            <label for="input-psv">PSV per Person</label>
            <input type="number" id="input-psv" min="0" value="100" />
          </div>
        </aside>
        <section class="results-pane">
          <div class="results" id="results-display"></div>
          <div class="tree-view" id="tree-display"></div>
        </section>
      `;
      return container;
    }

    const appMount = document.getElementById('app-mount');
    const contentNode = renderSimulator();
    appMount.appendChild(createToolShell('Genealogy Simulator', contentNode));

    const inLevels = document.getElementById('input-levels');
    const inRecruits = document.getElementById('input-recruits');
    const inPsv = document.getElementById('input-psv');
    const resultsDisplay = document.getElementById('results-display');
    const treeDisplay = document.getElementById('tree-display');

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem('usana-tools:genealogy-last-inputs'));
        if (saved) {
          inLevels.value = saved.levels || 3;
          inRecruits.value = saved.recruits || 2;
          inPsv.value = saved.psv || 100;
        }
      } catch (e) {}
    }

    function saveState() {
      localStorage.setItem('usana-tools:genealogy-last-inputs', JSON.stringify({
        levels: Number(inLevels.value),
        recruits: Number(inRecruits.value),
        psv: Number(inPsv.value)
      }));
    }

    function updateSimulation() {
      saveState();
      
      const outcome = calculateGenealogyOutcome(null, {
        levels: inLevels.value,
        recruitsPerLevel: inRecruits.value,
        psvPerPerson: inPsv.value
      });

      resultsDisplay.innerHTML = `
        <h3>Simulated Outcome</h3>
        <p><strong>Total Organization Size:</strong> ${outcome.totalPeople.toLocaleString()} distributors</p>
        <p><strong>Total Volume (SVP):</strong> ${outcome.totalSvp.toLocaleString()}</p>
        <p><strong>Estimated Bonus:</strong> $${outcome.estimatedBonus.toLocaleString()}</p>
        <div class="disclaimer">
          * ALL FIGURES ARE HYPOTHETICAL AND FOR ILLUSTRATIVE PURPOSES ONLY. This does not represent actual income or a guarantee of earnings.
        </div>
      `;

      let treeHTML = '<h3>Organization Structure</h3>';
      let currentWidth = 1;
      
      for (let i = 0; i <= Number(inLevels.value); i++) {
        if (i === 0) {
          treeHTML += '<div><span class="node">You</span></div>';
        } else {
          currentWidth *= Number(inRecruits.value);
          const displayNodes = Math.min(currentWidth, 50); 
          const extra = currentWidth > 50 ? ` + ${currentWidth - 50} more` : '';
          
          let nodesStr = '';
          for (let j = 0; j < displayNodes; j++) nodesStr += '<span class="node">Distributor</span>';
          
          treeHTML += `<div style="margin-top: 15px;"><strong>Level ${i}:</strong><br/> ${nodesStr} ${extra}</div>`;
        }
      }
      treeDisplay.innerHTML = treeHTML;
    }

    [inLevels, inRecruits, inPsv].forEach(input => {
      input.addEventListener('input', updateSimulation);
    });

    loadState();
    updateSimulation();
  </script>
</body>
</html>
