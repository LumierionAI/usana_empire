<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Ledger - USANA Empire</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
    }
    
    /* Layout */
    .dashboard-grid {
      display: grid;
      gap: var(--spacing-md);
      grid-template-columns: 1fr;
    }
    @media (min-width: 768px) {
      .dashboard-grid { grid-template-columns: 1fr 2fr; }
      .metrics-row { grid-column: 1 / -1; }
      .table-row { grid-column: 1 / -1; }
    }

    /* Metrics Cards */
    .metrics-row {
      display: grid;
      gap: var(--spacing-md);
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .metric-card {
      background: var(--color-surface);
      padding: var(--spacing-md);
      border-radius: 8px;
      border-left: 4px solid var(--color-primary);
    }
    .metric-card h3 { margin: 0 0 var(--spacing-sm) 0; font-size: 0.9rem; color: #666; text-transform: uppercase; }
    .metric-card .value { font-size: 1.8rem; font-weight: bold; color: var(--color-primary); }
    .metric-card.profit .value { color: #16a34a; }
    .metric-card.expense .value { color: #dc2626; }

    /* Forms & Containers */
    .panel {
      background: var(--color-surface);
      padding: var(--spacing-md);
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .panel h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid var(--color-primary); padding-bottom: 0.5rem; }
    
    .form-group { margin-bottom: var(--spacing-md); }
    .form-group label { display: block; font-weight: bold; margin-bottom: 0.25rem; font-size: 0.875rem; }
    .form-group input, .form-group select, .form-group textarea { 
      width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn-primary { background: var(--color-primary); color: #fff; }
    
    /* Native SVG Chart */
    .chart-container {
      width: 100%;
      height: 250px;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #eee;
      position: relative;
      overflow: hidden;
    }
    
    /* DataTable Overrides */
    .data-table-container { background: #fff; padding: var(--spacing-md); border-radius: 8px; border: 1px solid #ddd; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th { background: var(--color-primary); color: #fff; padding: 0.75rem; }
    .data-table td { padding: 0.75rem; border-bottom: 1px solid #eee; }
    
    .type-badge {
      display: inline-block; padding: 0.25rem 0.5rem; border-radius: 99px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
    }
    .badge-sale { background: #dcfce7; color: #166534; }
    .badge-commission { background: #dbeafe; color: #1e40af; }
    .badge-expense, .badge-inventory { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div id="app-mount"></div>

  <script type="module">
    import { createToolShell } from '../../src/shared/components/ToolShell.js';
    import { createDataTable } from '../../src/shared/components/DataTable.js';
    import { storageAdapter } from '../../src/shared/storage-adapter.js';
    import { calculateLedgerTotals } from '../../src/shared/calc-engine/ledger-calc.js';

    // --- State ---
    let ledgerEntries = [];

    // --- UI Scaffolding ---
    function renderApp() {
      const container = document.createElement('div');
      container.className = 'dashboard-grid';
      
      container.innerHTML = `
        <div class="metrics-row" id="metrics-mount">
          <!-- Metrics injected here -->
        </div>
        
        <aside class="panel">
          <h2>Add Entry</h2>
          <form id="ledger-form">
            <div class="form-group">
              <label for="entry-date">Date</label>
              <input type="date" id="entry-date" required>
            </div>
            <div class="form-group">
              <label for="entry-type">Transaction Type</label>
              <select id="entry-type" required>
                <option value="sale">Retail Sale (Income)</option>
                <option value="commission">Weekly Commission (Income)</option>
                <option value="inventory">Product Inventory (Expense)</option>
                <option value="expense">Business Expense (Expense)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="entry-amount">Amount (Php)</label>
              <input type="number" id="entry-amount" min="0.01" step="0.01" required placeholder="0.00">
            </div>
            <div class="form-group">
              <label for="entry-desc">Description / Notes</label>
              <input type="text" id="entry-desc" placeholder="e.g., CellSentials Pack">
            </div>
            <button type="submit" class="btn btn-primary">Save Entry</button>
          </form>
        </aside>
        
        <section class="panel">
          <h2>Profit Trend</h2>
          <div class="chart-container" id="chart-mount"></div>
        </section>
        
        <section class="table-row">
          <div id="table-mount"></div>
        </section>
      `;
      return container;
    }

    const appMount = document.getElementById('app-mount');
    appMount.appendChild(createToolShell('Financial Ledger', renderApp()));

    // Set default date to today
    document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];

    // --- Application Logic ---
    const form = document.getElementById('ledger-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const amount = parseFloat(document.getElementById('entry-amount').value);
      if (amount <= 0 || isNaN(amount)) {
        alert("Amount must be a positive number.");
        return;
      }

      const newEntry = {
        id: crypto.randomUUID(),
        date: document.getElementById('entry-date').value,
        type: document.getElementById('entry-type').value,
        amount: amount,
        description: document.getElementById('entry-desc').value.trim(),
        createdAt: new Date().toISOString()
      };

      await storageAdapter.set('ledger', newEntry);
      document.getElementById('entry-amount').value = '';
      document.getElementById('entry-desc').value = '';
      await loadData();
    });

    function formatCurrency(num) {
      return 'Php ' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderMetrics(totals) {
      const mount = document.getElementById('metrics-mount');
      mount.innerHTML = `
        <div class="metric-card profit">
          <h3>Net Profit</h3>
          <div class="value">${formatCurrency(totals.netProfit)}</div>
        </div>
        <div class="metric-card">
          <h3>Total Revenue</h3>
          <div class="value">${formatCurrency(totals.revenue)}</div>
          <div style="font-size: 0.8rem; color:#666; margin-top: 4px;">
            Retail: ${formatCurrency(totals.retailSalesTotal)} | Comm: ${formatCurrency(totals.commissionTotal)}
          </div>
        </div>
        <div class="metric-card expense">
          <h3>Total Expenses</h3>
          <div class="value">${formatCurrency(totals.expenses)}</div>
        </div>
      `;
    }

    function renderTable() {
      const mount = document.getElementById('table-mount');
      
      // Sort newest first
      const sorted = [...ledgerEntries].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      const formattedData = sorted.map(entry => {
        let sign = (entry.type === 'expense' || entry.type === 'inventory') ? '-' : '+';
        return {
          'Date': entry.date,
          'Type': `<span class="type-badge badge-${entry.type}">${entry.type}</span>`,
          'Description': entry.description || '-',
          'Amount': `<strong>${sign}${formatCurrency(entry.amount)}</strong>`
        };
      });

      mount.innerHTML = '';
      mount.appendChild(createDataTable(['Date', 'Type', 'Description', 'Amount'], formattedData));
    }

    function renderTrendChart() {
      const mount = document.getElementById('chart-mount');
      mount.innerHTML = '';
      
      if (ledgerEntries.length === 0) {
        mount.innerHTML = '<div style="padding: 1rem; color: #666;">Not enough data to plot trend.</div>';
        return;
      }

      // Sort chronological for plotting
      const sorted = [...ledgerEntries].sort((a, b) => new Date(a.date) - new Date(b.date));
      
      let runningProfit = 0;
      const points = sorted.map(entry => {
        if (entry.type === 'sale' || entry.type === 'commission') runningProfit += entry.amount;
        if (entry.type === 'expense' || entry.type === 'inventory') runningProfit -= entry.amount;
        return runningProfit;
      });

      const maxProfit = Math.max(...points, 100);
      const minProfit = Math.min(...points, 0);
      const range = maxProfit - minProfit || 1;

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("viewBox", "0 0 1000 200");
      svg.setAttribute("preserveAspectRatio", "none");

      // Draw zero line if minProfit < 0
      if (minProfit < 0) {
        const zeroY = 200 - ((0 - minProfit) / range) * 180 - 10;
        const zeroLine = document.createElementNS(svgNS, "line");
        zeroLine.setAttribute("x1", "0"); zeroLine.setAttribute("y1", zeroY);
        zeroLine.setAttribute("x2", "1000"); zeroLine.setAttribute("y2", zeroY);
        zeroLine.setAttribute("stroke", "#e5e7eb"); zeroLine.setAttribute("stroke-width", "2");
        svg.appendChild(zeroLine);
      }

      // Plot line
      let polylinePts = [];
      const stepX = points.length > 1 ? 1000 / (points.length - 1) : 500;
      
      points.forEach((val, i) => {
        const x = i * stepX;
        // Map Y to fit within 20-180px padding
        const y = 200 - ((val - minProfit) / range) * 180 - 10; 
        polylinePts.push(`${x},${y}`);
        
        // Data points
        const circle = document.createElementNS(svgNS, "circle");
        circle.setAttribute("cx", x);
        circle.setAttribute("cy", y);
        circle.setAttribute("r", "4");
        circle.setAttribute("fill", "var(--color-primary)");
        svg.appendChild(circle);
      });

      const polyline = document.createElementNS(svgNS, "polyline");
      polyline.setAttribute("points", polylinePts.join(" "));
      polyline.setAttribute("fill", "none");
      polyline.setAttribute("stroke", "var(--color-primary)");
      polyline.setAttribute("stroke-width", "3");
      svg.appendChild(polyline);

      mount.appendChild(svg);
    }

    async function loadData() {
      ledgerEntries = await storageAdapter.list('ledger') || [];
      const totals = calculateLedgerTotals(ledgerEntries);
      
      renderMetrics(totals);
      renderTrendChart();
      renderTable();
    }

    // Init
    loadData();
  </script>
</body>
</html>
