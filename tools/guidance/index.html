<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Guidance - USANA Empire</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
    }
    
    .guidance-layout {
      display: grid;
      gap: var(--spacing-lg);
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .guidance-layout { grid-template-columns: 350px 1fr; }
    }

    .panel {
      background: var(--color-surface);
      padding: var(--spacing-md);
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .panel h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid var(--color-primary); padding-bottom: 0.5rem; }
    
    .form-group { margin-bottom: var(--spacing-md); }
    .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-group select, .form-group input[type="text"] { 
      width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;
    }
    
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: normal !important;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .checkbox-label input { margin-right: 0.5rem; }

    .btn { padding: 0.75rem 1rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: var(--spacing-sm); }
    .btn-primary { background: var(--color-primary); color: #fff; }

    /* Results */
    .disclaimer-banner {
      background-color: #fef2f2;
      border-left: 4px solid #ef4444;
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      border-radius: 4px;
    }
    .disclaimer-banner strong { color: #b91c1c; display: block; margin-bottom: 4px; }
    .disclaimer-banner p { margin: 0; font-size: 0.85rem; color: #7f1d1d; }

    .recommendation-list { display: flex; flex-direction: column; gap: var(--spacing-md); }
    .rec-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: var(--spacing-md);
      border-left: 4px solid var(--color-accent);
    }
    .rec-card h3 { margin: 0 0 0.5rem 0; color: var(--color-primary); }
    .rec-card p { margin: 0 0 0.5rem 0; font-size: 0.95rem; line-height: 1.4; }
    .rec-card .source { font-size: 0.75rem; color: #6b7280; font-style: italic; border-top: 1px solid #eee; padding-top: 0.5rem; margin-top: 0.5rem; }

    .empty-state {
      text-align: center;
      padding: var(--spacing-xl);
      color: #6b7280;
      background: #fff;
      border-radius: 8px;
      border: 1px dashed #d1d5db;
    }
  </style>
</head>
<body>
  <div id="app-mount"></div>

  <script type="module">
    import { createToolShell } from '../../src/shared/components/ToolShell.js';

    // --- State ---
    let rules = [];

    // --- UI Scaffolding ---
    function renderApp() {
      const container = document.createElement('div');
      container.className = 'guidance-layout';
      
      container.innerHTML = `
        <aside class="panel">
          <h2>Client Intake Form</h2>
          <form id="intake-form">
            <div class="form-group">
              <label for="client-age">Age Bracket</label>
              <select id="client-age">
                <option value="18-35">18 - 35</option>
                <option value="36-50">36 - 50</option>
                <option value="51+">51+</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Primary Wellness Goals</label>
              <div class="checkbox-grid">
                <label class="checkbox-label"><input type="checkbox" name="goals" value="foundational"> Foundational Nutrition</label>
                <label class="checkbox-label"><input type="checkbox" name="goals" value="energy"> Energy & Vitality</label>
                <label class="checkbox-label"><input type="checkbox" name="goals" value="immunity"> Immune Support</label>
                <label class="checkbox-label"><input type="checkbox" name="goals" value="heart"> Heart Health</label>
                <label class="checkbox-label"><input type="checkbox" name="goals" value="joints"> Joint & Bone</label>
                <label class="checkbox-label"><input type="checkbox" name="goals" value="brain"> Brain & Cognitive</label>
              </div>
            </div>

            <div class="form-group">
              <label for="client-diet">Dietary Preferences</label>
              <select id="client-diet">
                <option value="none">No Restrictions</option>
                <option value="vegetarian">Vegetarian</option>
                <option value="vegan">Vegan</option>
                <option value="gluten-free">Gluten-Free</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary">Generate Recommendations</button>
          </form>
        </aside>
        
        <section class="results-view">
          <div class="disclaimer-banner">
            <strong>NOT MEDICAL ADVICE</strong>
            <p>The products and information provided are for educational purposes only and are not intended to diagnose, treat, cure, or prevent any disease. Always advise clients to consult with a qualified healthcare physician before starting any diet, supplement, or exercise program.</p>
          </div>
          
          <div id="results-mount">
            <div class="empty-state">Fill out the intake form to generate rule-based product recommendations.</div>
          </div>
        </section>
      `;
      return container;
    }

    const appMount = document.getElementById('app-mount');
    appMount.appendChild(createToolShell('Product Guidance', renderApp()));

    // --- Application Logic ---
    const form = document.getElementById('intake-form');
    const resultsMount = document.getElementById('results-mount');

    // Pure function for matching rules as required by business logic constraints
    function matchGuidanceRules(intake, ruleSet) {
      const recommendations = [];
      
      ruleSet.forEach(rule => {
        // Simple intersection match: if any intake goal exists in the rule's match goals
        const goalMatch = rule.match.goals.some(g => intake.goals.includes(g));
        
        if (goalMatch) {
          recommendations.push(rule.recommendation);
        }
      });
      
      return recommendations;
    }

    function saveState(intake) {
      localStorage.setItem('usana-tools:guidance-last-intake', JSON.stringify(intake));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem('usana-tools:guidance-last-intake'));
        if (saved) {
          document.getElementById('client-age').value = saved.age || '18-35';
          document.getElementById('client-diet').value = saved.diet || 'none';
          
          const checkboxes = document.querySelectorAll('input[name="goals"]');
          checkboxes.forEach(cb => {
            if (saved.goals && saved.goals.includes(cb.value)) {
              cb.checked = true;
            }
          });
        }
      } catch (e) {
        console.error("Failed to load intake state.");
      }
    }

    function renderResults(recs) {
      if (recs.length === 0) {
        resultsMount.innerHTML = `
          <div class="empty-state">
            No specific product matches found for these criteria. Recommend starting with foundational nutrition (CellSentials).
          </div>
        `;
        return;
      }

      let html = '<div class="recommendation-list">';
      recs.forEach(rec => {
        html += `
          <div class="rec-card">
            <h3>${rec.productName}</h3>
            <p>${rec.rationale}</p>
            <div class="source">Source: ${rec.source}</div>
          </div>
        `;
      });
      html += '</div>';
      
      resultsMount.innerHTML = html;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const formData = new FormData(form);
      const intake = {
        age: formData.get('client-age'),
        diet: formData.get('client-diet'),
        goals: formData.getAll('goals')
      };

      saveState(intake);
      const recommendations = matchGuidanceRules(intake, rules);
      renderResults(recommendations);
    });

    async function init() {
      try {
        const response = await fetch('/src/tools/guidance/guidance-rules.json');
        rules = await response.json();
      } catch (error) {
        resultsMount.innerHTML = `<div class="empty-state" style="color: red;">Failed to load knowledge base rules.</div>`;
      }
      
      loadState();
    }

    init();
  </script>
</body>
</html>
